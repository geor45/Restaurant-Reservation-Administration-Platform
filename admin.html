<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Κρατήσεις</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --text: #2a211b;
      --muted: #7a6f67;
      --border: #e6ddd4;
      --primary: #0f766e;
      --primary-dark: #0b5f59;
      --success: #2e7d32;
      --danger: #b42318;
      --warning: #b54708;
      --archived: #5f6368;
      --shadow: 0 10px 30px rgba(42, 33, 27, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 40px auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    h2 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .login-card {
      max-width: 420px;
      margin: 80px auto;
      padding: 24px;
    }

    .panel-card {
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-ghost {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-cancel {
      background: #eee7df;
      color: var(--text);
    }

    .btn-archive {
      background: var(--archived);
      color: #fff;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .filter-btn {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .stat-box {
      background: #faf7f3;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat-box strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .stat-box span {
      font-size: 24px;
      font-weight: bold;
    }

    .reservations-grid {
      display: grid;
      gap: 16px;
    }

    .reservation-card {
      padding: 20px;
      border-top: 4px solid #ddd;
    }

    .reservation-card.pending { border-top-color: var(--warning); }
    .reservation-card.accepted { border-top-color: var(--success); }
    .reservation-card.rejected { border-top-color: var(--danger); }
    .reservation-card.archived { border-top-color: var(--archived); opacity: 0.92; }

    .reservation-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .reservation-head h3 {
      margin: 0 0 4px 0;
      font-size: 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.pending {
      background: #fff0c2;
      color: #8a5b00;
    }

    .badge.accepted {
      background: #dff3e2;
      color: #1f5f28;
    }

    .badge.rejected {
      background: #fde7e4;
      color: #8f1f16;
    }

    .badge.archived {
      background: #e9ecef;
      color: #4f5357;
    }

    .reservation-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 14px;
      margin: 14px 0;
    }

    .meta-box {
      background: #faf7f3;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-box strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .reservation-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: var(--danger); }
    .ok { color: var(--success); }

    .hidden { display: none !important; }

    .empty-state {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .status-note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f6f1eb;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal {
      width: min(640px, 100%);
      padding: 22px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .modal-help {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .pagination .page-info {
      font-size: 14px;
      color: var(--muted);
      min-width: 120px;
      text-align: right;
    }

    .pagination button {
      min-width: 44px;
    }

    @media (max-width: 860px) {
      .toolbar-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .wrap {
        width: min(100% - 20px, 1180px);
        margin: 20px auto;
      }

      h1 {
        font-size: 26px;
      }

      .login-card,
      .reservation-card,
      .modal,
      .panel-card {
        padding: 18px;
      }

      .modal-actions {
        justify-content: stretch;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Admin Panel</h1>
        <p class="muted">Διαχείριση αιτημάτων κράτησης</p>
      </div>
      <button id="logoutBtn" class="btn-ghost hidden">Αποσύνδεση</button>
    </div>

    <section id="loginSection" class="card login-card">
      <h2>Σύνδεση διαχειριστή</h2>
      <p class="muted">Συνδέσου με τον admin λογαριασμό σου.</p>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@email.com" />

      <label for="password">Κωδικός</label>
      <input type="password" id="password" placeholder="******" />

      <div style="margin-top:16px;">
        <button id="loginBtn" class="btn-primary">Σύνδεση</button>
      </div>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="adminSection" class="hidden">
      <div class="card panel-card">
        <div class="muted">Φίλτρα, αναζήτηση, ταξινόμηση, αρχειοθέτηση, pagination και export CSV.</div>

        <div class="toolbar-grid">
          <div>
            <label for="searchInput">Αναζήτηση</label>
            <input id="searchInput" type="text" placeholder="Όνομα, email, τηλέφωνο, ημερομηνία..." />
          </div>

          <div>
            <label for="sortSelect">Ταξινόμηση</label>
            <select id="sortSelect">
              <option value="newest">Νεότερες πρώτα</option>
              <option value="oldest">Παλαιότερες πρώτα</option>
              <option value="name-asc">Όνομα A-Z</option>
              <option value="name-desc">Όνομα Z-A</option>
            </select>
          </div>

          <div>
            <label for="archiveVisibilitySelect">Προβολή αρχειοθετημένων</label>
            <select id="archiveVisibilitySelect">
              <option value="hide">Κρύψε αρχειοθετημένες</option>
              <option value="show">Δείξε όλες</option>
              <option value="only">Μόνο αρχειοθετημένες</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">Όλες</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="accepted">Accepted</button>
          <button class="filter-btn" data-filter="rejected">Rejected</button>
          <button class="filter-btn" data-filter="archived">Archived</button>
          <button id="exportCsvBtn" class="btn-ghost" type="button">Export CSV</button>
          <button id="enableSoundBtn" class="btn-ghost" type="button">Ενεργοποίηση ήχου</button>
        </div>

        <div class="stats-row">
          <div class="stat-box">
            <strong>Σύνολο</strong>
            <span id="statAll">0</span>
          </div>
          <div class="stat-box">
            <strong>Pending</strong>
            <span id="statPending">0</span>
          </div>
          <div class="stat-box">
            <strong>Accepted</strong>
            <span id="statAccepted">0</span>
          </div>
          <div class="stat-box">
            <strong>Rejected</strong>
            <span id="statRejected">0</span>
          </div>
          <div class="stat-box">
            <strong>Archived</strong>
            <span id="statArchived">0</span>
          </div>
        </div>

        <div class="pagination">
          <button id="prevPageBtn" class="btn-ghost">
            ← Προηγούμενη
          </button>
          <button id="nextPageBtn" class="btn-ghost">
            Επόμενη →
          </button>
          <div class="page-info">
            Σελίδα <span id="currentPageNum">1</span> από <span id="totalPagesNum">1</span>
          </div>
        </div>
      </div>

      <div id="reservationsContainer" class="reservations-grid"></div>
    </section>
  </div>

  <div id="responseModalBackdrop" class="modal-backdrop hidden">
    <div class="card modal">
      <h2 id="modalTitle">Απάντηση κράτησης</h2>
      <p id="modalSubtitle" class="modal-help"></p>

      <label for="responseMessage">Μήνυμα προς πελάτη</label>
      <textarea id="responseMessage" placeholder="Γράψε ένα σύντομο μήνυμα που θα σταλεί με email στον πελάτη."></textarea>

      <div class="modal-actions">
        <button id="cancelResponseBtn" class="btn-cancel">Ακύρωση</button>
        <button id="confirmResponseBtn" class="btn-primary">Αποστολή & ενημέρωση</button>
      </div>

      <div id="modalMessage" class="message"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update,
      get
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import emailjs from "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/+esm";

    const firebaseConfig = {
      apiKey: "AIzaSyDZnoGbQ3LtPJSi9fm8h1hAXRMzqmsYsSg",
      authDomain: "vythos.firebaseapp.com",
      databaseURL: "https://vythos-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "vythos",
      storageBucket: "vythos.firebasestorage.app",
      messagingSenderId: "866948522913",
      appId: "1:866948522913:web:d601ca585aedfe7486a1e0",
    };

    const EMAILJS_PUBLIC_KEY = "grBG2EDy7Drg5LiNq";
    const EMAILJS_SERVICE_ID = "service_cjawqmc";
    const EMAILJS_TEMPLATE_ID = "template_mbokcji";
    const RESTAURANT_NAME = "ΨΑΡΟΤΑΒΕΡΝΑ ΒΥΘΟΣ";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    emailjs.init({
      publicKey: EMAILJS_PUBLIC_KEY
    });

    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginMessage = document.getElementById('loginMessage');
    const reservationsContainer = document.getElementById('reservationsContainer');

    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const archiveVisibilitySelect = document.getElementById('archiveVisibilitySelect');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const enableSoundBtn = document.getElementById('enableSoundBtn');

    const statAll = document.getElementById('statAll');
    const statPending = document.getElementById('statPending');
    const statAccepted = document.getElementById('statAccepted');
    const statRejected = document.getElementById('statRejected');
    const statArchived = document.getElementById('statArchived');

    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const currentPageNum = document.getElementById('currentPageNum');
    const totalPagesNum = document.getElementById('totalPagesNum');

    const responseModalBackdrop = document.getElementById('responseModalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const responseMessageInput = document.getElementById('responseMessage');
    const confirmResponseBtn = document.getElementById('confirmResponseBtn');
    const cancelResponseBtn = document.getElementById('cancelResponseBtn');
    const modalMessage = document.getElementById('modalMessage');

    const ITEMS_PER_PAGE = 10;

    let reservationsCache = {};
    let reservationsListenerAttached = false;
    let currentAction = null;
    let activeFilter = 'all';
    let searchTerm = '';
    let sortMode = 'newest';
    let archiveVisibility = 'hide';
    let currentPage = 1;

    let audioContext = null;
    let soundEnabled = false;
    let hasInitializedReservationSnapshot = false;
    let knownReservationIds = new Set();

    function showLoginMessage(message, type = 'error') {
      loginMessage.textContent = message;
      loginMessage.className = `message ${type === 'ok' ? 'ok' : 'error'}`;
    }

    function showModalMessage(message, type = 'error') {
      modalMessage.textContent = message;
      modalMessage.className = `message ${type === 'ok' ? 'ok' : 'error'}`;
    }

    function formatStatus(status) {
      if (status === 'accepted') return 'accepted';
      if (status === 'rejected') return 'rejected';
      if (status === 'archived') return 'archived';
      return 'pending';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getStatusLabel(status) {
      return status === 'accepted'
        ? 'Η κράτησή σας επιβεβαιώθηκε.'
        : 'Δυστυχώς η κράτησή σας δεν μπορεί να εξυπηρετηθεί.';
    }

    function getDefaultResponseMessage(status, reservation) {
      if (status === 'accepted') {
        return `Η κράτησή σας για ${reservation.date || '-'} στις ${reservation.time || '-'} για ${reservation.people || '-'} άτομα επιβεβαιώθηκε. Σας περιμένουμε!`;
      }
      return `Δυστυχώς δεν υπάρχει διαθεσιμότητα για ${reservation.date || '-'} στις ${reservation.time || '-'} για ${reservation.people || '-'} άτομα. Παρακαλούμε δοκιμάστε άλλη ημερομηνία ή ώρα.`;
    }

    function getStats() {
      const items = Object.values(reservationsCache || {});
      return {
        all: items.length,
        pending: items.filter(x => formatStatus(x.status) === 'pending').length,
        accepted: items.filter(x => formatStatus(x.status) === 'accepted').length,
        rejected: items.filter(x => formatStatus(x.status) === 'rejected').length,
        archived: items.filter(x => formatStatus(x.status) === 'archived').length
      };
    }

    function updateStats() {
      const stats = getStats();
      statAll.textContent = stats.all;
      statPending.textContent = stats.pending;
      statAccepted.textContent = stats.accepted;
      statRejected.textContent = stats.rejected;
      statArchived.textContent = stats.archived;
    }

    function getFilteredReservations() {
      let entries = Object.entries(reservationsCache || {}).map(([id, item]) => ({
        id,
        ...item,
        normalizedStatus: formatStatus(item.status)
      }));

      if (archiveVisibility === 'hide') {
        entries = entries.filter(item => item.normalizedStatus !== 'archived');
      } else if (archiveVisibility === 'only') {
        entries = entries.filter(item => item.normalizedStatus === 'archived');
      }

      if (activeFilter !== 'all') {
        entries = entries.filter(item => item.normalizedStatus === activeFilter);
      }

      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        entries = entries.filter(item => {
          const haystack = [
            item.name,
            item.email,
            item.phone,
            item.date,
            item.time,
            item.details
          ].join(' ').toLowerCase();
          return haystack.includes(q);
        });
      }

      entries.sort((a, b) => {
        const aCreated = Number(a.createdAt || 0);
        const bCreated = Number(b.createdAt || 0);

        if (sortMode === 'oldest') return aCreated - bCreated;
        if (sortMode === 'name-asc') return String(a.name || '').localeCompare(String(b.name || ''), 'el', { sensitivity: 'base' });
        if (sortMode === 'name-desc') return String(b.name || '').localeCompare(String(a.name || ''), 'el', { sensitivity: 'base' });
        return bCreated - aCreated;
      });

      return entries;
    }

    function getPaginatedReservations() {
      const all = getFilteredReservations();
      const total = all.length;
      const totalPages = Math.max(1, Math.ceil(total / ITEMS_PER_PAGE));

      if (currentPage < 1) currentPage = 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = all.slice(start, end);

      return {
        pageItems,
        currentPage,
        totalPages,
        total
      };
    }

    function updatePaginationUI() {
      const { currentPage, totalPages } = getPaginatedReservations();

      currentPageNum.textContent = currentPage;
      totalPagesNum.textContent = totalPages;

      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= totalPages;
    }

    function renderReservations() {
      updateStats();
      updatePaginationUI();

      const { pageItems } = getPaginatedReservations();

      if (!pageItems.length) {
        reservationsContainer.innerHTML = `
          <div class="card empty-state">
            Δεν βρέθηκαν κρατήσεις με τα τρέχοντα φίλτρα.
          </div>
        `;
        return;
      }

      reservationsContainer.innerHTML = pageItems.map((item) => {
        const status = item.normalizedStatus;
        const responseText = item.responseMessage
          ? `<div class="status-note"><strong>Τελευταίο μήνυμα:</strong><br>${escapeHtml(item.responseMessage)}</div>`
          : '';

        const archivedText = item.archivedAt
          ? `<div class="status-note"><strong>Αρχειοθετήθηκε:</strong><br>${new Date(item.archivedAt).toLocaleString('el-GR')}</div>`
          : '';

        const actionButtons = status === 'pending'
  ? `
    <button class="btn-success" data-id="${item.id}" data-action="accepted">Αποδοχή</button>
    <button class="btn-danger" data-id="${item.id}" data-action="rejected">Απόρριψη</button>
    <button class="btn-archive" data-id="${item.id}" data-action="archive">Αρχειοθέτηση</button>
  `
  : '';
        return `
          <article class="card reservation-card ${status}">
            <div class="reservation-head">
              <div>
                <h3>${escapeHtml(item.name || 'Χωρίς όνομα')}</h3>
                <div class="muted">${escapeHtml(item.email || '-')}</div>
              </div>
              <span class="badge ${status}">${status}</span>
            </div>

            <div class="reservation-meta">
              <div class="meta-box">
                <strong>Τηλέφωνο</strong>
                <span>${escapeHtml(item.phone || '-')}</span>
              </div>
              <div class="meta-box">
                <strong>Ημερομηνία</strong>
                <span>${escapeHtml(item.date || '-')}</span>
              </div>
              <div class="meta-box">
                <strong>Ώρα</strong>
                <span>${escapeHtml(item.time || '-')}</span>
              </div>
              <div class="meta-box">
                <strong>Άτομα</strong>
                <span>${escapeHtml(item.people || '-')}</span>
              </div>
            </div>

            <div class="meta-box">
              <strong>Λεπτομέρειες</strong>
              <span>${escapeHtml(item.details || '-')}</span>
            </div>

            ${responseText}
            ${archivedText}

            <div class="reservation-actions">
              ${actionButtons}
            </div>
          </article>
        `;
      }).join('');
    }

    function csvEscape(value) {
      const str = String(value ?? '');
      return `"${str.replace(/"/g, '""')}"`;
    }

    function exportReservationsToCsv() {
      const rows = getFilteredReservations();

      if (!rows.length) {
        alert('Δεν υπάρχουν κρατήσεις για export.');
        return;
      }

      const headers = [
        'ID',
        'Status',
        'Name',
        'Email',
        'Phone',
        'Date',
        'Time',
        'People',
        'Details',
        'Response Message',
        'Created At',
        'Responded At',
        'Archived At'
      ];

      const csvLines = [
        headers.map(csvEscape).join(',')
      ];

      rows.forEach((item) => {
        csvLines.push([
          item.id,
          item.normalizedStatus,
          item.name || '',
          item.email || '',
          item.phone || '',
          item.date || '',
          item.time || '',
          item.people || '',
          item.details || '',
          item.responseMessage || '',
          item.createdAt ? new Date(Number(item.createdAt)).toLocaleString('el-GR') : '',
          item.respondedAt ? new Date(Number(item.respondedAt)).toLocaleString('el-GR') : '',
          item.archivedAt ? new Date(Number(item.archivedAt)).toLocaleString('el-GR') : ''
        ].map(csvEscape).join(','));
      });

      const csvContent = '\uFEFF' + csvLines.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `reservations-export-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function checkAdminAccess(uid) {
      const snapshot = await get(ref(db, `admins/${uid}`));
      return snapshot.exists() && snapshot.val() === true;
    }

    function ensureAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    async function enableNotificationSound() {
      try {
        const ctx = ensureAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }

        soundEnabled = true;
        enableSoundBtn.textContent = 'Ήχος ενεργός';
        enableSoundBtn.disabled = true;

        playNotificationSound();
      } catch (error) {
        alert('Ο browser μπλόκαρε τον ήχο. Δοκίμασε ξανά.');
      }
    }

    function playNotificationSound() {
      if (!soundEnabled) return;

      const ctx = ensureAudioContext();
      const now = ctx.currentTime;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.type = 'sine';
      osc2.type = 'sine';

      osc1.frequency.setValueAtTime(880, now);
      osc2.frequency.setValueAtTime(1174, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now + 0.06);

      osc1.stop(now + 0.32);
      osc2.stop(now + 0.45);
    }

    async function maybeShowBrowserNotification(newItemsCount) {
      if (!('Notification' in window)) return;

      if (Notification.permission === 'granted') {
        new Notification('Νέα κράτηση', {
          body: `Έφτασαν ${newItemsCount} νέες κρατήσεις για έλεγχο.`,
          icon: '/favicon.ico'
        });
      }
    }

    function attachReservationsListener() {
      if (reservationsListenerAttached) return;
      reservationsListenerAttached = true;

      onValue(ref(db, 'reservations'), (snapshot) => {
        const incoming = snapshot.val() || {};
        const incomingIds = Object.keys(incoming);

        if (!hasInitializedReservationSnapshot) {
          knownReservationIds = new Set(incomingIds);
          hasInitializedReservationSnapshot = true;
        } else {
          const newIds = incomingIds.filter(id => !knownReservationIds.has(id));

          if (newIds.length > 0) {
            playNotificationSound();
            maybeShowBrowserNotification(newIds.length);
          }

          knownReservationIds = new Set(incomingIds);
        }

        reservationsCache = incoming;
        renderReservations();
      });
    }

    function openResponseModal(id, action) {
      const reservation = reservationsCache[id];
      if (!reservation) return;

      currentAction = { id, action };
      modalTitle.textContent = action === 'accepted' ? 'Αποδοχή κράτησης' : 'Απόρριψη κράτησης';
      modalSubtitle.textContent = `${reservation.name || 'Πελάτης'} • ${reservation.date || '-'} • ${reservation.time || '-'} • ${reservation.people || '-'} άτομα`;
      responseMessageInput.value = getDefaultResponseMessage(action, reservation);
      showModalMessage('', 'ok');
      confirmResponseBtn.disabled = false;
      cancelResponseBtn.disabled = false;
      responseModalBackdrop.classList.remove('hidden');
    }

    function closeResponseModal() {
      currentAction = null;
      responseModalBackdrop.classList.add('hidden');
      responseMessageInput.value = '';
      showModalMessage('', 'ok');
      confirmResponseBtn.disabled = false;
      cancelResponseBtn.disabled = false;
    }

    async function sendReservationEmail(reservation, status, responseMessage) {
      const templateParams = {
        to_name: reservation.name || '',
        to_email: reservation.email || '',
        reservation_date: reservation.date || '',
        reservation_time: reservation.time || '',
        reservation_people: String(reservation.people || ''),
        restaurant_name: RESTAURANT_NAME,
        response_message: responseMessage,
        status_label: getStatusLabel(status)
      };

      return emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        templateParams,
        { publicKey: EMAILJS_PUBLIC_KEY }
      );
    }

    async function archiveReservation(id) {
      const reservation = reservationsCache[id];
      if (!reservation) return;

      const confirmed = window.confirm('Να αρχειοθετηθεί αυτή η κράτηση;');
      if (!confirmed) return;

      try {
        await update(ref(db, `reservations/${id}`), {
          status: 'archived',
          archivedAt: Date.now()
        });
      } catch (error) {
        alert('Αποτυχία αρχειοθέτησης: ' + (error?.message || 'Άγνωστο σφάλμα'));
      }
    }

    async function processReservationAction() {
      if (!currentAction) return;

      const { id, action } = currentAction;
      const reservation = reservationsCache[id];
      const responseMessage = responseMessageInput.value.trim();

      if (!reservation) {
        showModalMessage('Η κράτηση δεν βρέθηκε.');
        return;
      }

      if (!reservation.email) {
        showModalMessage('Δεν υπάρχει email πελάτη για αποστολή.');
        return;
      }

      if (!responseMessage) {
        showModalMessage('Γράψε ένα μήνυμα για τον πελάτη.');
        return;
      }

      confirmResponseBtn.disabled = true;
      cancelResponseBtn.disabled = true;
      showModalMessage('Αποστολή email...', 'ok');

      try {
        await sendReservationEmail(reservation, action, responseMessage);

        await update(ref(db, `reservations/${id}`), {
          status: action,
          responseMessage,
          respondedAt: Date.now()
        });

        showModalMessage('Το email στάλθηκε και η κράτηση ενημερώθηκε.', 'ok');

        setTimeout(() => {
          closeResponseModal();
        }, 700);
      } catch (error) {
        showModalMessage('Αποτυχία αποστολής email: ' + (error?.text || error?.message || 'Άγνωστο σφάλμα'));
        confirmResponseBtn.disabled = false;
        cancelResponseBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showLoginMessage('Συμπλήρωσε email και κωδικό.');
        return;
      }

      showLoginMessage('', 'ok');

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        showLoginMessage('Αποτυχία σύνδεσης: ' + error.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    enableSoundBtn.addEventListener('click', async () => {
      await enableNotificationSound();

      if ('Notification' in window && Notification.permission === 'default') {
        try {
          await Notification.requestPermission();
        } catch (error) {}
      }
    });

    reservationsContainer.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-id][data-action]');
      if (!button) return;

      const { id, action } = button.dataset;

      if (action === 'accepted' || action === 'rejected') {
        openResponseModal(id, action);
        return;
      }

      if (action === 'archive') {
        archiveReservation(id);
      }
    });

    confirmResponseBtn.addEventListener('click', processReservationAction);
    cancelResponseBtn.addEventListener('click', closeResponseModal);
    exportCsvBtn.addEventListener('click', exportReservationsToCsv);

    prevPageBtn.addEventListener('click', () => {
      currentPage = Math.max(1, currentPage - 1);
      renderReservations();
    });

    nextPageBtn.addEventListener('click', () => {
      const { totalPages } = getPaginatedReservations();
      currentPage = Math.min(totalPages, currentPage + 1);
      renderReservations();
    });

    responseModalBackdrop.addEventListener('click', (event) => {
      if (event.target === responseModalBackdrop) {
        closeResponseModal();
      }
    });

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      currentPage = 1;
      renderReservations();
    });

    sortSelect.addEventListener('change', (e) => {
      sortMode = e.target.value;
      currentPage = 1;
      renderReservations();
    });

    archiveVisibilitySelect.addEventListener('change', (e) => {
      archiveVisibility = e.target.value;
      currentPage = 1;
      renderReservations();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        filterButtons.forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        currentPage = 1;
        renderReservations();
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const isAdmin = await checkAdminAccess(user.uid);

          if (!isAdmin) {
            await signOut(auth);
            showLoginMessage('Δεν έχετε δικαίωμα πρόσβασης στο admin panel.');
            return;
          }

          currentPage = 1;
          loginSection.classList.add('hidden');
          adminSection.classList.remove('hidden');
          logoutBtn.classList.remove('hidden');
          showLoginMessage('', 'ok');
          attachReservationsListener();
        } catch (error) {
          await signOut(auth);
          showLoginMessage('Σφάλμα ελέγχου πρόσβασης: ' + error.message);
        }
      } else {
        currentPage = 1;
        loginSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
        logoutBtn.classList.add('hidden');
        reservationsCache = {};
        hasInitializedReservationSnapshot = false;
        knownReservationIds = new Set();
        soundEnabled = false;
        if (enableSoundBtn) {
          enableSoundBtn.disabled = false;
          enableSoundBtn.textContent = 'Ενεργοποίηση ήχου';
        }
        renderReservations();
      }
    });
  </script>
</body>
